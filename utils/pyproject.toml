[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-num-utils"
version = "0.1.0"
description = "Utilities shared across DTU Advanced Numerical Methods assignments."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Philip Nickel"}
]
dependencies = [
  "matplotlib>=3.5",
  "scienceplots>=2.1"
]

[tool.setuptools]
packages = ["utils"]

[tool.setuptools.package-dir]
utils = "."
