[project]
name = "adv-num-alg"
version = "0.1.0"
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy",
    "matplotlib", 
    "scipy",
    "scienceplots",
    "numba",
    "sympy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assignment_1", "assignment_2", "utils"]
